<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arroseur</title>
<style>
body{margin:0;font:16px system-ui,sans-serif;background:#0f172a;color:#e2e8f0;padding:16px;max-width:480px;margin:auto}
h1{font-size:20px}
.card{background:#1e293b;border-radius:12px;padding:14px;margin:12px 0}
.big{font-size:44px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{flex:1;padding:14px 8px;border:0;border-radius:10px;background:#334155;color:#fff;font-size:15px}
button.on{background:#2563eb}
input{width:100%;box-sizing:border-box;padding:10px;margin:4px 0 8px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff}
.dim{color:#94a3b8;font-size:13px}
.pump{display:inline-block;padding:4px 12px;border-radius:20px;font-weight:700}
.pump.on{background:#2563eb}.pump.off{background:#475569}
pre#con{background:#020617;color:#94a3b8;font:12px ui-monospace,Menlo,monospace;padding:8px;border-radius:8px;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:8px 0 0}
</style>
</head>
<body>
<h1>🌱 Arroseur</h1>
<div class="card">
  <div class="dim">Humidité du sol</div>
  <div class="big" id="hum">--</div>
  <div>Pompe : <span id="pump" class="pump off">?</span></div>
  <div class="dim" id="age"></div>
</div>
<div class="card">
  <div class="dim">Ordre</div>
  <div class="row" style="margin-top:8px">
    <button data-m="auto">Auto</button>
    <button data-m="on">Forcer arrosage</button>
    <button data-m="off">Forcer arrêt</button>
  </div>
</div>
<div class="card">
  <div class="dim">Réglages</div>
  <input id="url" placeholder="https://arroseur.xxx.workers.dev">
  <input id="tok" type="password" placeholder="Jeton secret">
  <button id="save">Enregistrer</button>
  <div class="dim" id="err"></div>
</div>
<div class="card">
  <div class="dim">Console (pour le rapport)</div>
  <pre id="con"></pre>
  <div class="row" style="margin-top:8px"><button id="cpy">📋 Copier le rapport</button><button id="clr">🧹 Vider</button></div>
</div>
<script>
const $ = id => document.getElementById(id);
const cfg = () => ({url: (localStorage.arr_url || '').replace(/\/$/, ''), tok: localStorage.arr_tok || ''});
$('url').value = cfg().url; $('tok').value = cfg().tok;
$('save').onclick = () => { log('Réglages enregistrés'); localStorage.arr_url = $('url').value.trim(); localStorage.arr_tok = $('tok').value.trim(); refresh(); };

/* ---------- Console ---------- */
const lines = [];
function log(msg) {
  lines.push(new Date().toLocaleTimeString() + '  ' + msg);
  if (lines.length > 200) lines.shift();
  $('con').textContent = lines.join('\n');
  $('con').scrollTop = $('con').scrollHeight;
}
function report() {
  const c = cfg();
  return ['=== Rapport PWA Arroseur ===',
    'Heure : ' + new Date().toLocaleString(),
    'Adresse : ' + (c.url || '(vide)'),
    'Jeton : ' + (c.tok ? c.tok.length + ' caractères' : '(vide)'),
    'Ordre choisi dans la page : ' + (choisi ? choisi + ' (il y a ' + Math.round((Date.now() - choisiA) / 1000) + ' s)' : '(aucun)'),
    'Navigateur : ' + navigator.userAgent,
    'En ligne : ' + navigator.onLine,
    '', '--- Console ---', lines.join('\n')].join('\n');
}
window.addEventListener('error', e => log('ERREUR PAGE : ' + e.message));
window.addEventListener('unhandledrejection', e => log('PROMESSE REJETÉE : ' + (e.reason && e.reason.message || e.reason)));

async function api(method, path, body) {
  const c = cfg();
  const t0 = Date.now();
  log('→ ' + method + ' ' + path + (body ? ' ' + JSON.stringify(body) : ''));
  let r;
  try {
    r = await fetch(c.url + path, {
      method,
      headers: {Authorization: 'Bearer ' + c.tok, 'Content-Type': 'application/json'},
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) {
    log('✗ ' + method + ' ' + path + ' : réseau/CORS impossible (' + e.message + ')');
    throw new Error('Réseau : ' + e.message);
  }
  const txt = await r.text();
  log((r.ok ? '← ' : '✗ ') + r.status + ' ' + method + ' ' + path + ' (' + (Date.now() - t0) + ' ms) ' + txt.slice(0, 300));
  if (!r.ok) throw new Error('Erreur ' + r.status);
  try { return JSON.parse(txt); } catch (e) { log('✗ réponse non JSON'); throw new Error('Réponse invalide'); }
}

let choisi = null, choisiA = 0;
function show(mode) { document.querySelectorAll('[data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === mode)); }

async function refresh() {
  if (!cfg().url) { $('err').textContent = 'Renseigne l’adresse et le jeton.'; return; }
  try {
    const e = await api('GET', '/etat');
    if (!choisi) $('err').textContent = '';
    if (e.mesure) {
      $('hum').textContent = Math.round(100 - e.mesure.valeur / 65535 * 100) + ' %';
      $('pump').textContent = e.mesure.pompe ? 'ON' : 'OFF';
      $('pump').className = 'pump ' + (e.mesure.pompe ? 'on' : 'off');
      $('age').textContent = 'Mesure reçue il y a ' + Math.round((e.maintenant - e.mesure.vu) / 1000) + ' s';
    }
    const mode = (choisi && Date.now() - choisiA < 70000) ? choisi : e.mode;
    if (choisi && e.mode !== choisi) log('ℹ le Worker renvoie encore « ' + e.mode + ' » (choix local : ' + choisi + ') — délai KV possible');
    show(mode);
  } catch (x) { $('err').textContent = x.message; }
}
$('cpy').onclick = async () => {
  try { await navigator.clipboard.writeText(report()); $('cpy').textContent = '✅ Copié'; }
  catch (e) { $('con').textContent = report(); $('cpy').textContent = 'Sélectionne le texte et copie'; }
  setTimeout(() => $('cpy').textContent = '📋 Copier le rapport', 2000);
};
$('clr').onclick = () => { lines.length = 0; $('con').textContent = ''; };

document.querySelectorAll('[data-m]').forEach(b => b.onclick = async () => {
  try {
    await api('POST', '/ordre', {mode: b.dataset.m});
    choisi = b.dataset.m; choisiA = Date.now(); show(choisi);
    $('err').textContent = 'Ordre envoyé. L’ESP32 peut mettre jusqu’à 1 min à le voir.';
  } catch (x) { $('err').textContent = x.message; }
});
log('Page ouverte'); refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
